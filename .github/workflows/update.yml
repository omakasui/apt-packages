name: Update APT repo

on:
  repository_dispatch:
    types: [packages-updated]

  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
        type: string
      version:
        description: 'Version'
        required: true
        type: string
      suites:
        description: 'Suites — space-separated, e.g. "trixie" or "trixie noble"'
        required: true
        type: string
      produces:
        description: 'Space-separated list of produced package names. Leave empty to use package name.'
        required: false
        type: string
      channel:
        description: 'Publishing channel (stable or dev)'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - dev

# Must stay in sync with build-matrix.yml in omakasui/build-apt-packages.
env:
  ALL_SUITES: "trixie noble resolute"
  ALL_DEV_SUITES: "trixie-dev noble-dev resolute-dev"
  ALL_ARCHES: "amd64 arm64"

# Serialize runs so concurrent package-updated events don't overwrite each other.
concurrency:
  group: update-apt-repo
  cancel-in-progress: false

jobs:
  update:
    name: Update APT repo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve parameters
        id: params
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "action=packages-updated" >> "$GITHUB_OUTPUT"
            PKGS_JSON=$(echo '${{ toJson(github.event.client_payload.packages) }}' | jq -c '. // []')
            echo "packages_json=${PKGS_JSON}" >> "$GITHUB_OUTPUT"
          else
            echo "action=package-updated"          >> "$GITHUB_OUTPUT"
            echo "package=${{ inputs.package }}"   >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}"   >> "$GITHUB_OUTPUT"
            echo "suites=${{ inputs.suites }}"     >> "$GITHUB_OUTPUT"
            if [[ -n "${{ inputs.produces }}" ]]; then
              PRODUCES_JSON=$(echo "${{ inputs.produces }}" | tr ' ' '\n' | jq -Rc '[.,inputs]' 2>/dev/null || echo "[]")
              echo "produces=${PRODUCES_JSON}"     >> "$GITHUB_OUTPUT"
            else
              echo "produces=[]"                   >> "$GITHUB_OUTPUT"
            fi
            echo "channel=${{ inputs.channel }}"   >> "$GITHUB_OUTPUT"
          fi

      - name: Setup APT tools and GPG key
        id: setup-apt
        uses: ./.github/actions/setup-apt
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: '[packages-updated] Register all packages in index manifest'
        if: steps.params.outputs.action == 'packages-updated'
        env:
          GH_TOKEN: ${{ secrets.APT_PKG_DISPATCH_TOKEN }}
        run: |
          PKGS_JSON='${{ steps.params.outputs.packages_json }}'
          while IFS= read -r entry; do
            PKG=$(echo      "$entry" | jq -r '.package')
            VERSION=$(echo  "$entry" | jq -r '.version')
            SUITES=$(echo   "$entry" | jq -r '.suites')
            PRODUCES=$(echo "$entry" | jq -r '.produces | if length == 0 then "" else join(" ") end')
            CHANNEL=$(echo  "$entry" | jq -r '.channel // "stable"')

            echo "==> Registering: ${PKG} ${VERSION} (suites: ${SUITES}, channel: ${CHANNEL})"
            bash scripts/register-package.sh \
              --pkg      "$PKG" \
              --version  "$VERSION" \
              --suites   "$SUITES" \
              --produces "$PRODUCES" \
              --channel  "$CHANNEL"
          done < <(echo "$PKGS_JSON" | jq -c '.[]')

      - name: '[package-updated] Register package in index manifest'
        if: steps.params.outputs.action == 'package-updated'
        env:
          GH_TOKEN: ${{ secrets.APT_PKG_DISPATCH_TOKEN }}
        run: |
          PRODUCES_JSON='${{ steps.params.outputs.produces }}'
          if [[ "$PRODUCES_JSON" == "null" || "$PRODUCES_JSON" == "[]" || -z "$PRODUCES_JSON" ]]; then
            PRODUCES=""
          else
            PRODUCES=$(echo "$PRODUCES_JSON" | jq -r '.[]' | tr '\n' ' ')
          fi

          bash scripts/register-package.sh \
            --pkg      "${{ steps.params.outputs.package }}" \
            --version  "${{ steps.params.outputs.version }}" \
            --suites   "${{ steps.params.outputs.suites }}" \
            --produces "$PRODUCES" \
            --channel  "${{ steps.params.outputs.channel }}"

      - name: Regenerate APT metadata
        env:
          GPG_KEY_ID: ${{ steps.setup-apt.outputs.fingerprint }}
        run: |
          touch index/packages.tsv
          bash scripts/update-index.sh --suites "$ALL_SUITES"
          bash scripts/sign-release.sh --suites "$ALL_SUITES $ALL_DEV_SUITES" --key-id "$GPG_KEY_ID"

      - name: Update README packages table
        run: bash scripts/update-readme.sh --suites "$ALL_SUITES" --arches "$ALL_ARCHES"

      - name: Build commit message
        id: msg
        run: |
          ACTION="${{ steps.params.outputs.action }}"
          PKG="${{ steps.params.outputs.package }}"
          VERSION="${{ steps.params.outputs.version }}"
          DATE="$(date '+%Y-%m-%d')"

          if [[ "$ACTION" == "packages-updated" ]]; then
            PKGS_JSON='${{ steps.params.outputs.packages_json }}'
            ENTRIES=$(echo "$PKGS_JSON" | jq -r '[.[] | "\(.package) \(.version)"] | unique | .[]')
            COUNT=$(echo "$ENTRIES" | grep -c .)
            if [[ "$COUNT" -le 1 ]]; then
              MSG="apt: ${ENTRIES} [${DATE}]"
              BODY=""
            else
              MSG="apt: update ${COUNT} packages [${DATE}]"
              BODY="$ENTRIES"
            fi
          else
            MSG="apt: ${PKG} ${VERSION} [${DATE}]"
            BODY=""
          fi

          echo "value=${MSG}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<COMMIT_BODY_EOF"
            echo "$BODY"
            echo "COMMIT_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: ${{ steps.msg.outputs.value }}
          body: ${{ steps.msg.outputs.body }}

      - name: Trigger omakasui.org rebuild
        env:
          GH_TOKEN: ${{ secrets.OMAKASUI_ORG_DISPATCH_TOKEN }}
        run: |
          gh api repos/omakasui/omakasui.org/dispatches \
            --method POST \
            --field event_type=apt-packages-updated